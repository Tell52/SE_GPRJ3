name: se-gprj3
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: event_planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: event_planner
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_planner -d event_planner"]
      interval: 2s
      timeout: 5s
      retries: 30
  db-test:
    image: postgres:16
    profiles: [test]
    environment:
      POSTGRES_USER: event_planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: event_planner_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5434}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_planner -d event_planner_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  # Lab 5: the production image run locally (docker compose --profile app up --build).
  # migrate runs once (migrations + non-destructive seed), then app starts on http://localhost:3000.
  migrate:
    build: .
    profiles: [app]
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/prisma/seed.js"]
    environment:
      DATABASE_URL: postgresql://event_planner:${POSTGRES_PASSWORD}@db:5432/event_planner?schema=public
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    profiles: [app]
    environment:
      DATABASE_URL: postgresql://event_planner:${POSTGRES_PASSWORD}@db:5432/event_planner?schema=public
      SESSION_TTL_HOURS: "8"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
  postgres_test_data: