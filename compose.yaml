name: se-gprj3
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: event_planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: event_planner
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_planner -d event_planner"]
      interval: 2s
      timeout: 5s
      retries: 30
  db-test:
    image: postgres:16
    profiles: [test]
    environment:
      POSTGRES_USER: event_planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: event_planner_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5434}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_planner -d event_planner_test"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
  postgres_test_data:
